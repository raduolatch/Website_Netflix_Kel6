<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netpliks</title>
    <link rel="icon" type="image/png" href="Letter_N-removebg-preview.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'net-black': '#141414',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Hero section background tetap menggunakan custom CSS karena layer gradient-nya kompleks */
        .bg-hero {
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 100%), 
                        url('https://assets.nflxext.com/ffe/siteui/vlv3/ab180a27-b661-44d7-a6d9-940cb32f2f4a/7fb62e44-31fd-4e1c-bba3-1e7412d420ce/ID-en-20231009-popsignuptwoweeks-perspective_alpha_website_large.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="font-inter bg-net-black text-white m-0 p-0 box-border">
    
    <!-- Navbar -->
    <nav id="navbar" class="fixed top-0 w-full flex justify-between items-center px-[4%] py-5 z-[100] bg-transparent transition-colors duration-400 ease-in-out">
        <div class="flex items-center gap-10">
            <img class="h-[30px] cursor-pointer" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="logo netplik">
            <ul class="flex gap-5 list-none m-0 p-0">
                <li><a href="#" class="text-[#e5e5e5] text-sm no-underline transition-colors duration-300 hover:text-[#b3b3b3]">Home</a></li>
                <li><a href="#" class="text-[#e5e5e5] text-sm no-underline transition-colors duration-300 hover:text-[#b3b3b3]">TV Shows</a></li>
                <li><a href="#" class="text-[#e5e5e5] text-sm no-underline transition-colors duration-300 hover:text-[#b3b3b3]">Movies</a></li>
                <li><a href="#" class="text-[#e5e5e5] text-sm no-underline transition-colors duration-300 hover:text-[#b3b3b3]">New & Popular</a></li>
                <li><a href="#" class="text-[#e5e5e5] text-sm no-underline transition-colors duration-300 hover:text-[#b3b3b3]">My List</a></li>
            </ul>
        </div>
        
        <div class="flex items-center gap-5 text-sm">
            <form class="flex items-center" action="mentenans.html" method="GET">
                <input type="text" name="search" placeholder="Cari film..." required class="text-black px-2 py-1 rounded-sm outline-none">
                <button type="submit" class="cursor-pointer text-lg ml-2 bg-transparent border-none">🔍</button>
            </form>
            <span>Kids</span>
            <span class="cursor-pointer text-lg">🔔</span>
            <img class="h-[32px] rounded cursor-pointer" src="https://i.pinimg.com/736x/24/a5/4c/24a54c075ae7a7e7ae16d69e2766cefe.jpg" alt="Foto Pengguna">
        </div>
    </nav>
    
    <!-- Hero Section -->
    <div class="h-screen bg-hero flex flex-col justify-center pl-[4%]">
        <h1 class="text-5xl font-bold mb-2.5">Unlimited movies, TV shows, and more.</h1>
    </div>
    
    <!-- Simulasi Scroll -->
    <div class="h-[150vh]"></div>

    <!-- Script Navbar berubah warna saat scroll -->
    <script>
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.remove('bg-transparent');
                navbar.classList.add('bg-net-black');
            } else {
                navbar.classList.add('bg-transparent');
                navbar.classList.remove('bg-net-black');
            }
        });
    </script>
</body>
</html>
